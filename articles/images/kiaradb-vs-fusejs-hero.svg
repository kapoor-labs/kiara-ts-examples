<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Client-side search showdown: KiaraDB beats Fuse.js</title><desc id="desc">A fight-card hero image for client-side search over 100,000 records. On typo search, Fuse.js took 422 milliseconds tuned and 601 with defaults; KiaraDB, crowned the winner, took 1.95 milliseconds, 216 times faster, and was up to 515 times faster on filters. A race strip shows KiaraDB finishing almost instantly while Fuse.js runs the full length. KiaraDB won 26 of 26 shared filter scenarios and ran 66 scenarios Fuse.js cannot express.</desc>
<defs><linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050d1a"/><stop offset="1" stop-color="#0a1c33"/></linearGradient>
<linearGradient id="hero-loser" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1f29"/><stop offset="1" stop-color="#262b33"/></linearGradient>
<linearGradient id="hero-winner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f3b3d"/><stop offset="1" stop-color="#0d2a3a"/></linearGradient>
<radialGradient id="hero-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#64e0bf" stop-opacity="0.45"/><stop offset="1" stop-color="#64e0bf" stop-opacity="0"/></radialGradient>
<linearGradient id="hero-bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6a3c"/><stop offset="1" stop-color="#f6bd70"/></linearGradient>
<filter id="hero-blur" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="14"/></filter></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1600" height="840" fill="url(#hero-bg)"/><text x="800" y="62" font-size="24" fill="#64e0bf" font-weight="700" text-anchor="middle" letter-spacing="4">CLIENT-SIDE SEARCH SHOWDOWN  ·  100,000 RECORDS</text><path d="M40 92 L812 92 L732 492 L40 492 Z" fill="url(#hero-loser)" stroke="#3a414d" stroke-width="2"/><text x="90" y="180" font-size="60" fill="#aeb7c4" font-weight="700" data-max-width="400">Fuse.js</text><text x="90" y="330" font-size="132" fill="#f6bd70" font-weight="800" data-max-width="560">422 ms</text><text x="90" y="390" font-size="28" fill="#8d97a5" font-weight="500" data-max-width="600">typo search, tuned  ·  601 ms with defaults</text><text x="90" y="452" font-size="26" fill="#8d97a5" font-weight="400" data-max-width="560">Scores every record, every search.</text><ellipse cx="1190" cy="300" rx="420" ry="230" fill="url(#hero-glow)"/><path d="M852 92 L1560 92 L1560 492 L772 492 Z" fill="url(#hero-winner)" stroke="#64e0bf" stroke-width="3"/><g data-box="1330 112 200 52"><rect x="1330" y="112" width="200" height="52" rx="26" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><text x="1430" y="148" font-size="28" fill="#1a1405" font-weight="800" text-anchor="middle" letter-spacing="3">WINNER</text></g><path d="M900 174 L900 136 L918 154 L934 128 L950 154 L968 136 L968 174 Z" fill="#ffd166"/><text x="986" y="176" font-size="68" fill="#f2f6fc" font-weight="800" data-max-width="400">KiaraDB</text><text x="900" y="336" font-size="150" fill="#64e0bf" font-weight="800" filter="url(#hero-blur)" opacity="0.7">1.95 ms</text><text x="900" y="336" font-size="150" fill="#64e0bf" font-weight="800" data-max-width="620">1.95 ms</text><text x="904" y="410" font-size="52" fill="#f2f6fc" font-weight="800" data-max-width="600">216× faster</text><text x="904" y="458" font-size="26" fill="#b8e9dc" font-weight="400" data-max-width="600">on typo search  ·  up to 515× on filters</text><circle cx="792" cy="292" r="74" fill="#081426" stroke="#64e0bf" stroke-width="4"/><text x="792" y="314" font-size="62" fill="#f2f6fc" font-weight="900" text-anchor="middle">VS</text><text x="80" y="548" font-size="20" fill="#afc2d7" font-weight="700" data-max-width="400">TIME TO ANSWER A TYPO SEARCH</text><text x="80" y="588" font-size="26" fill="#64e0bf" font-weight="700" data-max-width="200">KiaraDB</text><rect x="260" y="568" width="8" height="26" rx="4" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="286" y="590" font-size="24" fill="#64e0bf" font-weight="700" data-max-width="400">1.95 ms  ·  done</text><text x="80" y="638" font-size="26" fill="#f6bd70" font-weight="700" data-max-width="200">Fuse.js</text><rect x="260" y="618" width="1260" height="26" rx="6" fill="url(#hero-bar)" stroke="url(#hero-bar)" stroke-width="2"/><text x="1384" y="638" font-size="24" fill="#1a1405" font-weight="800" data-max-width="120">422 ms</text><g data-box="80 676 450 74"><rect x="80" y="676" width="450" height="74" rx="14" fill="#0e2236" stroke="#304963" stroke-width="2"/><text x="104" y="725" font-size="34" fill="#64e0bf" font-weight="800" data-max-width="150">26/26</text><text x="216" y="721" font-size="22" fill="#afc2d7" font-weight="500" data-max-width="300">shared filter scenarios won</text></g><g data-box="575 676 450 74"><rect x="575" y="676" width="450" height="74" rx="14" fill="#0e2236" stroke="#304963" stroke-width="2"/><text x="599" y="725" font-size="34" fill="#64e0bf" font-weight="800" data-max-width="150">515×</text><text x="711" y="721" font-size="22" fill="#afc2d7" font-weight="500" data-max-width="300">fastest win, first 20 results</text></g><g data-box="1070 676 450 74"><rect x="1070" y="676" width="450" height="74" rx="14" fill="#0e2236" stroke="#304963" stroke-width="2"/><text x="1094" y="725" font-size="34" fill="#64e0bf" font-weight="800" data-max-width="150">+66</text><text x="1206" y="721" font-size="22" fill="#afc2d7" font-weight="500" data-max-width="300">queries Fuse.js can't express</text></g><text x="800" y="800" font-size="20" fill="#7f93a8" font-weight="400" text-anchor="middle">Median latency, 100,000 records, one machine, three isolated runs  ·  KiaraDB 1.2.0 vs Fuse.js 7.5.0  ·  npm run bench:fuse</text></g></svg>
