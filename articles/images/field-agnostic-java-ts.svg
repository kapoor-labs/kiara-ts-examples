<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Schema-driven indexing and advanced filters in KiaraDB</title><desc id="desc">A typed schema is prepared into internal indexes. Status, numeric bands, and collection requirements are composed in one query. Java and TypeScript are implementation options.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#9caaff"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#9caaff" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">07</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Your users choose the filters.</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">KiaraDB prepares the indexes.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Search field combinations without manually managing composite indexes.</text>
<g data-box="80 335 405 335"><rect x="80" y="335" width="405" height="335" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="115" y="382" font-size="23" fill="#9caaff" font-weight="700" data-max-width="335">01 / DEFINE FIELDS</text><text x="115" y="450" font-size="29" fill="#f2f6fc" font-weight="500" data-max-width="335">status     text</text><text x="115" y="510" font-size="29" fill="#f2f6fc" font-weight="500" data-max-width="335">score      number</text><text x="115" y="570" font-size="29" fill="#f2f6fc" font-weight="500" data-max-width="335">tags       collection</text><text x="115" y="631" font-size="25" fill="#afc2d7" font-weight="400" data-max-width="335">one schema</text></g><path d="M485 499 L564 499" fill="none" stroke="#9caaff" stroke-width="3" marker-end="url(#arrow)"/><g data-box="585 335 400 335"><rect x="585" y="335" width="400" height="335" rx="20" fill="#11243b" stroke="#9caaff" stroke-width="2"/><text x="620" y="382" font-size="23" fill="#9caaff" font-weight="700" data-max-width="330">02 / PREPARE</text><rect x="623" y="427" width="320" height="29" rx="6" fill="#283b66" stroke="#475894" stroke-width="2"/><circle cx="646" cy="441" r="5" fill="#9caaff"/><circle cx="709" cy="441" r="5" fill="#9caaff"/><circle cx="772" cy="441" r="5" fill="#9caaff"/><circle cx="835" cy="441" r="5" fill="#9caaff"/><rect x="623" y="475" width="320" height="29" rx="6" fill="#283b66" stroke="#475894" stroke-width="2"/><circle cx="646" cy="489" r="5" fill="#9caaff"/><circle cx="709" cy="489" r="5" fill="#9caaff"/><circle cx="772" cy="489" r="5" fill="#9caaff"/><circle cx="835" cy="489" r="5" fill="#9caaff"/><rect x="623" y="523" width="320" height="29" rx="6" fill="#283b66" stroke="#475894" stroke-width="2"/><circle cx="646" cy="537" r="5" fill="#9caaff"/><circle cx="709" cy="537" r="5" fill="#9caaff"/><circle cx="772" cy="537" r="5" fill="#9caaff"/><circle cx="835" cy="537" r="5" fill="#9caaff"/><text x="620" y="631" font-size="25" fill="#afc2d7" font-weight="400" data-max-width="330">internal indexes</text></g><path d="M985 499 L1064 499" fill="none" stroke="#9caaff" stroke-width="3" marker-end="url(#arrow)"/><g data-box="1085 335 435 335"><rect x="1085" y="335" width="435" height="335" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="1120" y="382" font-size="23" fill="#9caaff" font-weight="700" data-max-width="365">03 / COMPOSE</text><text x="1120" y="450" font-size="28" fill="#f2f6fc" font-weight="500" data-max-width="365">status = active</text><text x="1120" y="510" font-size="28" fill="#f2f6fc" font-weight="500" data-max-width="365">score BETWEEN 80..95</text><text x="1120" y="570" font-size="28" fill="#f2f6fc" font-weight="500" data-max-width="365">tags CONTAINS_ALL</text><text x="1120" y="631" font-size="25" fill="#afc2d7" font-weight="400" data-max-width="365">one query</text></g>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">Java + TypeScript implementations. Prepared, in-memory data. No universal latency claim.</text>
</g></svg>
