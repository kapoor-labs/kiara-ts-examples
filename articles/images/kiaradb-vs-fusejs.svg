<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">KiaraDB and Fuse.js benchmark: query latency and build time</title><desc id="desc">Typo search over 100,000 products took 1.95 milliseconds in KiaraDB, 422 in tuned Fuse.js, and 601 in default Fuse.js. Building the indexes for the same 100,000 products took 4,286 milliseconds in KiaraDB and 266 in Fuse.js, which also used 110 MB of memory against KiaraDB's 489 MB.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#64e0bf"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#64e0bf" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">11</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">KiaraDB vs Fuse.js,</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">measured side by side.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Faster queries on one side, faster index builds on the other. Every exact result verified.</text>
<g data-box="80 330 700 390"><rect x="80" y="330" width="700" height="390" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="110" y="378" font-size="23" fill="#64e0bf" font-weight="700" data-max-width="640">TYPO SEARCH, 100,000 PRODUCTS (p50)</text><text x="110" y="430" font-size="26" fill="#f2f6fc" font-weight="600" data-max-width="420">KiaraDB</text><rect x="110" y="446" width="8" height="30" rx="6" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="136" y="470" font-size="26" fill="#64e0bf" font-weight="700" data-max-width="170">1.95 ms</text><text x="110" y="522" font-size="26" fill="#f2f6fc" font-weight="600" data-max-width="420">Fuse.js (tuned)</text><rect x="110" y="538" width="323" height="30" rx="6" fill="#f6bd70" stroke="#f6bd70" stroke-width="2"/><text x="451" y="562" font-size="26" fill="#f6bd70" font-weight="700" data-max-width="170">422 ms</text><text x="110" y="614" font-size="26" fill="#f2f6fc" font-weight="600" data-max-width="420">Fuse.js (defaults)</text><rect x="110" y="630" width="460" height="30" rx="6" fill="#f6bd70" stroke="#f6bd70" stroke-width="2"/><text x="588" y="654" font-size="26" fill="#f6bd70" font-weight="700" data-max-width="170">601 ms</text></g><g data-box="820 330 700 390"><rect x="820" y="330" width="700" height="390" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="850" y="378" font-size="23" fill="#64e0bf" font-weight="700" data-max-width="640">INDEX BUILD, 100,000 PRODUCTS</text><text x="850" y="430" font-size="26" fill="#f2f6fc" font-weight="600" data-max-width="420">KiaraDB</text><rect x="850" y="446" width="460" height="30" rx="6" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="1328" y="470" font-size="26" fill="#64e0bf" font-weight="700" data-max-width="170">4,286 ms</text><text x="850" y="522" font-size="26" fill="#f2f6fc" font-weight="600" data-max-width="420">Fuse.js</text><rect x="850" y="538" width="29" height="30" rx="6" fill="#f6bd70" stroke="#f6bd70" stroke-width="2"/><text x="897" y="562" font-size="26" fill="#f6bd70" font-weight="700" data-max-width="170">266 ms</text></g><text x="850" y="680" font-size="24" fill="#afc2d7" font-weight="400" data-max-width="640">Memory after build: KiaraDB 489 MB, Fuse.js 110 MB</text>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">One machine, synthetic and historical data, three isolated runs. Reproduce with npm run bench:fuse.</text>
</g></svg>
