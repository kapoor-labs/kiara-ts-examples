<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Introducing KiaraDB: query speed against Fuse.js</title><desc id="desc">Typo search over 100,000 products took 422 milliseconds in tuned Fuse.js and 1.95 in KiaraDB. KiaraDB answered first-20 lists 515 times faster, stemmed search 365 times, typo search 216 times, and date equality 163 times faster. It won all 26 filter queries both libraries can run and handled 66 more that Fuse.js cannot express.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#64e0bf"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#64e0bf" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">12</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Fuse.js: 422 ms.</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">KiaraDB: 1.95 ms.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Typo search over 100,000 products. Faster in all 26 filter queries both libraries can run.</text>
<g data-box="80 330 860 390"><rect x="80" y="330" width="860" height="390" rx="20" fill="#11243b" stroke="#64e0bf" stroke-width="2"/><text x="110" y="378" font-size="23" fill="#64e0bf" font-weight="700" data-max-width="800">TIMES FASTER THAN FUSE.JS, 100,000 RECORDS</text><text x="110" y="428" font-size="24" fill="#f2f6fc" font-weight="600" data-max-width="420">First 20 active products</text><rect x="110" y="440" width="560" height="24" rx="6" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="688" y="461" font-size="26" fill="#64e0bf" font-weight="700" data-max-width="120">515×</text><text x="110" y="500" font-size="24" fill="#f2f6fc" font-weight="600" data-max-width="420">Stemmed search</text><rect x="110" y="512" width="397" height="24" rx="6" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="525" y="533" font-size="26" fill="#64e0bf" font-weight="700" data-max-width="120">365×</text><text x="110" y="572" font-size="24" fill="#f2f6fc" font-weight="600" data-max-width="420">Typo search</text><rect x="110" y="584" width="235" height="24" rx="6" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="363" y="605" font-size="26" fill="#64e0bf" font-weight="700" data-max-width="120">216×</text><text x="110" y="644" font-size="24" fill="#f2f6fc" font-weight="600" data-max-width="420">Date equality</text><rect x="110" y="656" width="177" height="24" rx="6" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="305" y="677" font-size="26" fill="#64e0bf" font-weight="700" data-max-width="120">163×</text></g><g data-box="980 330 540 390"><rect x="980" y="330" width="540" height="390" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="1010" y="378" font-size="23" fill="#64e0bf" font-weight="700" data-max-width="480">QUERY SCENARIOS</text><text x="1010" y="470" font-size="72" fill="#64e0bf" font-weight="700" data-max-width="480">26 / 26</text><text x="1010" y="510" font-size="24" fill="#afc2d7" font-weight="400" data-max-width="480">shared scenarios won</text><text x="1010" y="610" font-size="72" fill="#f6bd70" font-weight="700" data-max-width="480">+66</text><text x="1010" y="650" font-size="24" fill="#afc2d7" font-weight="400" data-max-width="480">that Fuse.js cannot express</text></g>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">Median latency at 100,000 records, one machine, three isolated runs. Reproduce with npm run bench:fuse.</text>
</g></svg>
