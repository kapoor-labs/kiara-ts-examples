<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Automatic indexing supports changing filter combinations</title><desc id="desc">Status, score, tags, and window fields feed a prepared store with internal indexes. Several different queries use that same store.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#64e0bf"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#64e0bf" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">01</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">New filter combinations.</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">No new composite index.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Prepare once. Compose conditions over searchable fields.</text>
<g data-box="80 326 245 52"><rect x="80" y="326" width="245" height="52" rx="12" fill="#132b3c" stroke="#64e0bf" stroke-width="2"/><text x="98" y="361" font-size="25" fill="#64e0bf" font-weight="600" data-max-width="209">status</text></g><g data-box="80 410 245 52"><rect x="80" y="410" width="245" height="52" rx="12" fill="#132b3c" stroke="#64e0bf" stroke-width="2"/><text x="98" y="445" font-size="25" fill="#64e0bf" font-weight="600" data-max-width="209">score</text></g><g data-box="80 494 245 52"><rect x="80" y="494" width="245" height="52" rx="12" fill="#132b3c" stroke="#64e0bf" stroke-width="2"/><text x="98" y="529" font-size="25" fill="#64e0bf" font-weight="600" data-max-width="209">tags</text></g><g data-box="80 578 245 52"><rect x="80" y="578" width="245" height="52" rx="12" fill="#132b3c" stroke="#64e0bf" stroke-width="2"/><text x="98" y="613" font-size="25" fill="#64e0bf" font-weight="600" data-max-width="209">window</text></g><path d="M325 352 L465 478" fill="none" stroke="#64e0bf" stroke-width="3"/><path d="M325 436 L465 478" fill="none" stroke="#64e0bf" stroke-width="3"/><path d="M325 520 L465 478" fill="none" stroke="#64e0bf" stroke-width="3"/><path d="M325 604 L465 478" fill="none" stroke="#64e0bf" stroke-width="3"/><path d="M465 478 L515 478" fill="none" stroke="#64e0bf" stroke-width="3" marker-end="url(#arrow)"/><g data-box="525 330 440 300"><rect x="525" y="330" width="440" height="300" rx="20" fill="#11243b" stroke="#64e0bf" stroke-width="2"/><text x="560" y="382" font-size="23" fill="#64e0bf" font-weight="700" data-max-width="370">PREPARED STORE</text><rect x="565" y="416" width="355" height="20" rx="6" fill="#25445a" stroke="#25445a" stroke-width="2"/><rect x="565" y="454" width="331" height="20" rx="6" fill="#25445a" stroke="#25445a" stroke-width="2"/><rect x="565" y="492" width="307" height="20" rx="6" fill="#25445a" stroke="#25445a" stroke-width="2"/><rect x="565" y="530" width="283" height="20" rx="6" fill="#25445a" stroke="#25445a" stroke-width="2"/><text x="560" y="592" font-size="25" fill="#f2f6fc" font-weight="500" data-max-width="370">Internal indexes built for you</text></g><path d="M965 478 L1100 478" fill="none" stroke="#64e0bf" stroke-width="3" marker-end="url(#arrow)"/><g data-box="1118 330 402 300"><rect x="1118" y="330" width="402" height="300" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="1150" y="382" font-size="23" fill="#64e0bf" font-weight="700" data-max-width="335">COMPOSE A QUERY</text><text x="1150" y="443" font-size="28" fill="#f2f6fc" font-weight="500" data-max-width="335">status</text><text x="1150" y="502" font-size="28" fill="#f2f6fc" font-weight="500" data-max-width="335">status + score</text><text x="1150" y="561" font-size="28" fill="#f2f6fc" font-weight="500" data-max-width="335">status + score + tags</text></g><text x="80" y="703" font-size="32" fill="#afc2d7" font-weight="500" data-max-width="1440">Same dataset. Different questions.</text>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">Automatic indexing is not index-free storage. Records and indexes occupy memory.</text>
</g></svg>
