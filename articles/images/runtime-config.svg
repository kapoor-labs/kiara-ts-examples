<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Explainable rule selection and snapshot replacement</title><desc id="desc">Four candidate rules have specificity zero, one, one, and two. The exact rule wins. A separate pair of cards shows an active value of 40 and a prepared value of 50 before activation.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#f5bd78"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#f5bd78" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">06</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Know which rule wins.</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Keep the last good snapshot.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Query candidates. Define precedence. Prepare before activation.</text>
<g data-box="80 328 680 369"><rect x="80" y="328" width="680" height="369" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="115" y="374" font-size="23" fill="#f5bd78" font-weight="700" data-max-width="610">CANDIDATES / SPECIFICITY</text><text x="130" y="439" font-size="30" fill="#f2f6fc" font-weight="400" data-max-width="320">default</text><text x="525" y="439" font-size="27" fill="#afc2d7" font-weight="600" data-max-width="190">0</text><text x="130" y="508" font-size="30" fill="#f2f6fc" font-weight="400" data-max-width="320">production</text><text x="525" y="508" font-size="27" fill="#afc2d7" font-weight="600" data-max-width="190">1</text><text x="130" y="577" font-size="30" fill="#f2f6fc" font-weight="400" data-max-width="320">team</text><text x="525" y="577" font-size="27" fill="#afc2d7" font-weight="600" data-max-width="190">1</text><rect x="105" y="604" width="630" height="63" rx="10" fill="#39362d" stroke="#f5bd78" stroke-width="2"/><text x="130" y="646" font-size="30" fill="#f2f6fc" font-weight="700" data-max-width="320">exact</text><text x="525" y="646" font-size="27" fill="#f5bd78" font-weight="600" data-max-width="190">2  WINNER</text></g><g data-box="835 328 685 170"><rect x="835" y="328" width="685" height="170" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="870" y="375" font-size="23" fill="#f5bd78" font-weight="700" data-max-width="605">ACTIVE SNAPSHOT</text><text x="870" y="459" font-size="66" fill="#f2f6fc" font-weight="700" data-max-width="170">40</text><text x="1045" y="451" font-size="29" fill="#afc2d7" font-weight="400" data-max-width="435">continues answering</text></g><g data-box="835 527 685 170"><rect x="835" y="527" width="685" height="170" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="870" y="574" font-size="23" fill="#f5bd78" font-weight="700" data-max-width="605">PREPARED REPLACEMENT</text><text x="870" y="658" font-size="66" fill="#f5bd78" font-weight="700" data-max-width="170">50</text><text x="1045" y="650" font-size="29" fill="#afc2d7" font-weight="400" data-max-width="435">activate when valid</text></g><text x="80" y="737" font-size="25" fill="#afc2d7" font-weight="400" data-max-width="1440">Equal top scores? Report a tie, not a guess.</text>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">KiaraDB finds candidates. Your application owns ranking, validation, and activation.</text>
