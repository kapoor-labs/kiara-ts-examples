<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">KiaraDB versus Array.filter: speedup by dataset size and the cost of preparing indexes</title><desc id="desc">Times faster than Array.filter at 10,000 and then 100,000 records: first 20 of 70,072 active products 69 then 748; three fields equal 72 then 122; one field equal 10 then 8.9; 17,605 broad matches 2.1 then 1.8; two stored ranges 1.4 at 10,000, while at 100,000 Array.filter was 2.2 times faster. At 100,000 products KiaraDB took 4.0 seconds and 477 MB to prepare; Array.filter needs neither.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#64e0bf"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#64e0bf" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">15</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Array.filter scans every row.</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">KiaraDB pays once, then skips most.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Times faster than Array.filter at 10,000 and 100,000 records, one loss included.</text>
<g data-box="80 318 960 430"><rect x="80" y="318" width="960" height="430" rx="20" fill="#11243b" stroke="#64e0bf" stroke-width="2"/><text x="110" y="362" font-size="22" fill="#64e0bf" font-weight="700" data-max-width="620">TIMES FASTER THAN ARRAY.FILTER (LOG SCALE)</text><rect x="735" y="347" width="18" height="18" rx="4" fill="#47617e" stroke="#47617e" stroke-width="2"/><text x="762" y="363" font-size="20" fill="#afc2d7" font-weight="600" data-max-width="100">10,000</text><rect x="870" y="347" width="18" height="18" rx="4" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="897" y="363" font-size="20" fill="#f2f6fc" font-weight="600" data-max-width="110">100,000</text><text x="110" y="420" font-size="24" fill="#f2f6fc" font-weight="600" data-max-width="290">First 20 of 70,072</text><rect x="410" y="394" width="245" height="16" rx="4" fill="#47617e" stroke="#47617e" stroke-width="2"/><text x="665" y="408" font-size="18" fill="#afc2d7" font-weight="600" data-max-width="150">69×</text><rect x="410" y="416" width="383" height="16" rx="4" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="803" y="430" font-size="20" fill="#64e0bf" font-weight="700" data-max-width="300">748×</text><text x="110" y="488" font-size="24" fill="#f2f6fc" font-weight="600" data-max-width="290">Three fields equal</text><rect x="410" y="462" width="248" height="16" rx="4" fill="#47617e" stroke="#47617e" stroke-width="2"/><text x="668" y="476" font-size="18" fill="#afc2d7" font-weight="600" data-max-width="150">72×</text><rect x="410" y="484" width="278" height="16" rx="4" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="698" y="498" font-size="20" fill="#64e0bf" font-weight="700" data-max-width="300">122×</text><text x="110" y="556" font-size="24" fill="#f2f6fc" font-weight="600" data-max-width="290">One field equal</text><rect x="410" y="530" width="133" height="16" rx="4" fill="#47617e" stroke="#47617e" stroke-width="2"/><text x="553" y="544" font-size="18" fill="#afc2d7" font-weight="600" data-max-width="150">10×</text><rect x="410" y="552" width="127" height="16" rx="4" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="547" y="566" font-size="20" fill="#64e0bf" font-weight="700" data-max-width="300">8.9×</text><text x="110" y="624" font-size="24" fill="#f2f6fc" font-weight="600" data-max-width="290">17,605 broad matches</text><rect x="410" y="598" width="43" height="16" rx="4" fill="#47617e" stroke="#47617e" stroke-width="2"/><text x="463" y="612" font-size="18" fill="#afc2d7" font-weight="600" data-max-width="150">2.1×</text><rect x="410" y="620" width="34" height="16" rx="4" fill="#64e0bf" stroke="#64e0bf" stroke-width="2"/><text x="454" y="634" font-size="20" fill="#64e0bf" font-weight="700" data-max-width="300">1.8×</text><text x="110" y="692" font-size="24" fill="#f2f6fc" font-weight="600" data-max-width="290">Two stored ranges</text><rect x="410" y="666" width="19" height="16" rx="4" fill="#47617e" stroke="#47617e" stroke-width="2"/><text x="439" y="680" font-size="18" fill="#afc2d7" font-weight="600" data-max-width="150">1.4×</text><rect x="410" y="688" width="6" height="16" rx="4" fill="#ff7b72" stroke="#ff7b72" stroke-width="2"/><text x="426" y="702" font-size="20" fill="#ff7b72" font-weight="700" data-max-width="300">Array.filter 2.2× faster</text></g><g data-box="1080 318 440 430"><rect x="1080" y="318" width="440" height="430" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="1110" y="362" font-size="22" fill="#f6bd70" font-weight="700" data-max-width="380">THE COST, 100,000 PRODUCTS</text><text x="1110" y="420" font-size="24" fill="#afc2d7" font-weight="500" data-max-width="380">Prepare indexes</text><text x="1110" y="470" font-size="52" fill="#f6bd70" font-weight="700" data-max-width="380">4.0 s</text><text x="1110" y="530" font-size="24" fill="#afc2d7" font-weight="500" data-max-width="380">Extra memory</text><text x="1110" y="580" font-size="52" fill="#f6bd70" font-weight="700" data-max-width="380">477 MB</text><text x="1110" y="640" font-size="24" fill="#f2f6fc" font-weight="600" data-max-width="380">Array.filter: neither.</text><text x="1110" y="690" font-size="24" fill="#afc2d7" font-weight="400" data-max-width="380">Repaid after ~210</text><text x="1110" y="722" font-size="24" fill="#afc2d7" font-weight="400" data-max-width="380">three-field queries.</text></g>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">kiara-ts 1.2.1, median of three isolated Node.js runs, one machine. Reproduce with npm run bench:native.</text>
</g></svg>
