<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Bare values resolve to field conditions</title><desc id="desc">The query active emea is separated into status equals active and region equals emea. If active occurs in two fields, the interface asks for a choice.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#f6bd70"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#f6bd70" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">03</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Know the value?</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Skip the field hunt.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Whole-value discovery turns familiar input into explicit conditions.</text>
<g data-box="80 338 600 205"><rect x="80" y="338" width="600" height="205" rx="20" fill="#11243b" stroke="#f6bd70" stroke-width="2"/><text x="115" y="387" font-size="23" fill="#f6bd70" font-weight="700" data-max-width="525">WHAT THE USER TYPES</text><text x="115" y="477" font-size="60" fill="#f2f6fc" font-weight="600" data-max-width="525">active emea</text></g><path d="M680 438 L895 438" fill="none" stroke="#f6bd70" stroke-width="3" marker-end="url(#arrow)"/><g data-box="915 320 605 120"><rect x="915" y="320" width="605" height="120" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="945" y="365" font-size="21" fill="#f6bd70" font-weight="700" data-max-width="540">STATUS</text><text x="945" y="411" font-size="38" fill="#f2f6fc" font-weight="600" data-max-width="540">= active</text></g><g data-box="915 463 605 120"><rect x="915" y="463" width="605" height="120" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="945" y="508" font-size="21" fill="#f6bd70" font-weight="700" data-max-width="540">REGION</text><text x="945" y="554" font-size="38" fill="#f2f6fc" font-weight="600" data-max-width="540">= emea</text></g><text x="80" y="627" font-size="27" fill="#afc2d7" font-weight="400" data-max-width="1440">If two fields contain the same value:</text><g data-box="80 658 180 52"><rect x="80" y="658" width="180" height="52" rx="12" fill="#132b3c" stroke="#f6bd70" stroke-width="2"/><text x="98" y="693" font-size="25" fill="#f6bd70" font-weight="600" data-max-width="144">status?</text></g><g data-box="280 658 180 52"><rect x="280" y="658" width="180" height="52" rx="12" fill="#132b3c" stroke="#f6bd70" stroke-width="2"/><text x="298" y="693" font-size="25" fill="#f6bd70" font-weight="600" data-max-width="144">label?</text></g><text x="497" y="694" font-size="30" fill="#f2f6fc" font-weight="600" data-max-width="1440">Ask. Then make the condition explicit.</text>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">Whole-value discovery is schema-aware, not unrestricted natural-language understanding.</text>
</g></svg>
