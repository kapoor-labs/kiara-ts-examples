<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Typo correction preserves exact filtering</title><desc id="desc">The misspelling serch is corrected to search. Active status and score of at least 80 are still required. One record passes; an archived and a lower-score record do not.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#66dfd7"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#66dfd7" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">05</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Fix the typo.</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Keep every requirement.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Forgiving words should never mean forgiving a failed filter.</text>
<g data-box="80 334 595 150"><rect x="80" y="334" width="595" height="150" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="110" y="378" font-size="22" fill="#66dfd7" font-weight="700" data-max-width="530">LEXICAL CORRECTION</text><text x="110" y="445" font-size="47" fill="#afc2d7" font-weight="500" data-max-width="180">serch</text><path d="M302 428 L397 428" fill="none" stroke="#66dfd7" stroke-width="3" marker-end="url(#arrow)"/><text x="429" y="445" font-size="47" fill="#66dfd7" font-weight="600" data-max-width="210">search</text></g><g data-box="80 515 595 163"><rect x="80" y="515" width="595" height="163" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="110" y="558" font-size="22" fill="#66dfd7" font-weight="700" data-max-width="530">HARD REQUIREMENTS</text><text x="110" y="605" font-size="31" fill="#f2f6fc" font-weight="500" data-max-width="530">status = active</text><text x="110" y="649" font-size="31" fill="#f2f6fc" font-weight="500" data-max-width="530">score &gt;= 80</text></g><path d="M675 409 L812 500" fill="none" stroke="#66dfd7" stroke-width="3"/><path d="M675 597 L812 500" fill="none" stroke="#66dfd7" stroke-width="3"/><path d="M812 500 L910 500" fill="none" stroke="#66dfd7" stroke-width="3" marker-end="url(#arrow)"/><g data-box="930 334 590 344"><rect x="930" y="334" width="590" height="344" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="965" y="379" font-size="22" fill="#66dfd7" font-weight="700" data-max-width="520">RESULTS AFTER FILTERING</text><rect x="960" y="412" width="530" height="62" rx="10" fill="#193d43" stroke="#66dfd7" stroke-width="2"/><text x="985" y="454" font-size="29" fill="#f2f6fc" font-weight="600" data-max-width="480">r1   active     90     MATCH</text><text x="985" y="538" font-size="29" fill="#afc2d7" font-weight="400" data-max-width="480">r2   archived   95</text><text x="985" y="615" font-size="29" fill="#afc2d7" font-weight="400" data-max-width="480">r3   active     70</text></g>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">Autocomplete suggests words. KeywordSearch retrieves records. Conditions enforce requirements.</text>
</g></svg>
