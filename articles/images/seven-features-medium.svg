<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Tags, dates, and ranges combined with AND</title><desc id="desc">Three cards show required tags audited and export, a score from 80 to 95, and October 24 inside an October interval. All three feed one matching record.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#7eb9ff"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#7eb9ff" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">02</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Not every filter</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">is an equality check.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Combine membership, numeric bands, and stored intervals.</text>
<g data-box="80 330 450 255"><rect x="80" y="330" width="450" height="255" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="110" y="375" font-size="23" fill="#7eb9ff" font-weight="700" data-max-width="390">REQUIRE BOTH TAGS</text><g data-box="110 413 165 52"><rect x="110" y="413" width="165" height="52" rx="12" fill="#132b3c" stroke="#7eb9ff" stroke-width="2"/><text x="128" y="448" font-size="25" fill="#7eb9ff" font-weight="600" data-max-width="129">audited</text></g><g data-box="292 413 170 52"><rect x="292" y="413" width="170" height="52" rx="12" fill="#132b3c" stroke="#7eb9ff" stroke-width="2"/><text x="310" y="448" font-size="25" fill="#7eb9ff" font-weight="600" data-max-width="134">export</text></g><text x="110" y="546" font-size="27" fill="#f2f6fc" font-weight="600" data-max-width="390">CONTAINS_ALL</text></g><g data-box="575 330 450 255"><rect x="575" y="330" width="450" height="255" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="605" y="375" font-size="23" fill="#7eb9ff" font-weight="700" data-max-width="390">SCORE BAND</text><path d="M615 450 L975 450" fill="none" stroke="#47617e" stroke-width="3"/><path d="M680 450 L910 450" fill="none" stroke="#7eb9ff" stroke-width="3"/><circle cx="680" cy="450" r="9" fill="#7eb9ff"/><circle cx="910" cy="450" r="9" fill="#7eb9ff"/><text x="663" y="492" font-size="28" fill="#f2f6fc" font-weight="400" data-max-width="1440">80</text><text x="893" y="492" font-size="28" fill="#f2f6fc" font-weight="400" data-max-width="1440">95</text><text x="605" y="546" font-size="27" fill="#f2f6fc" font-weight="600" data-max-width="390">BETWEEN</text></g><g data-box="1070 330 450 255"><rect x="1070" y="330" width="450" height="255" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="1100" y="375" font-size="23" fill="#7eb9ff" font-weight="700" data-max-width="390">DATE IN A WINDOW</text><path d="M1110 450 L1475 450" fill="none" stroke="#7eb9ff" stroke-width="3"/><circle cx="1380" cy="450" r="11" fill="#64e0bf"/><text x="1110" y="490" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">Oct 1</text><text x="1408" y="490" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">Oct 31</text><text x="1308" y="421" font-size="23" fill="#64e0bf" font-weight="400" data-max-width="1440">Oct 24</text><text x="1100" y="546" font-size="27" fill="#f2f6fc" font-weight="600" data-max-width="390">CONTAINS_EITHER</text></g><path d="M305 585 L800 643" fill="none" stroke="#7eb9ff" stroke-width="3"/><path d="M800 585 L800 643" fill="none" stroke="#7eb9ff" stroke-width="3"/><path d="M1295 585 L800 643" fill="none" stroke="#7eb9ff" stroke-width="3"/><g data-box="530 644 540 72"><rect x="530" y="644" width="540" height="72" rx="20" fill="#11243b" stroke="#7eb9ff" stroke-width="2"/><text x="561" y="690" font-size="29" fill="#f2f6fc" font-weight="600" data-max-width="478">AND  /  one qualifying record</text></g>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">Collections of disjoint intervals can contain both endpoints and still leave a gap.</text>
</g></svg>
