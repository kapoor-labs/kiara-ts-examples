dth="260" height="52" rx="12" fill="#132b3c" stroke="#afc2d7" stroke-width="2"/><rect x="420" y="418" width="20" height="20" rx="4" fill="none" stroke="#afc2d7" stroke-width="2"/><text x="456" y="437" font-size="25" fill="#afc2d7" font-weight="600" data-max-width="186">brand</text></g><g data-box="400 464 260 52"><rect x="400" y="464" width="260" height="52" rx="12" fill="#132b3c" stroke="#afc2d7" stroke-width="2"/><rect x="420" y="480" width="20" height="20" rx="4" fill="none" stroke="#afc2d7" stroke-width="2"/><text x="456" y="499" font-size="25" fill="#afc2d7" font-weight="600" data-max-width="186">stars</text></g><g data-box="400 526 260 52"><rect x="400" y="526" width="260" height="52" rx="12" fill="#132b3c" stroke="#afc2d7" stroke-width="2"/><rect x="420" y="542" width="20" height="20" rx="4" fill="none" stroke="#afc2d7" stroke-width="2"/><text x="456" y="561" font-size="25" fill="#afc2d7" font-weight="600" data-max-width="186">price</text></g><g data-box="400 588 260 52"><rect x="400" y="588" width="260" height="52" rx="12" fill="#132b3c" stroke="#afc2d7" stroke-width="2"/><rect x="420" y="604" width="20" height="20" rx="4" fill="none" stroke="#afc2d7" stroke-width="2"/><text x="456" y="623" font-size="25" fill="#afc2d7" font-weight="600" data-max-width="186">region</text></g><g data-box="400 650 260 52"><rect x="400" y="650" width="260" height="52" rx="12" fill="#132b3c" stroke="#afc2d7" stroke-width="2"/><rect x="420" y="666" width="20" height="20" rx="4" fill="none" stroke="#afc2d7" stroke-width="2"/><text x="456" y="685" font-size="25" fill="#afc2d7" font-weight="600" data-max-width="186">type</text></g></g><path d="M700 525 L790 525" fill="none" stroke="#7eb9ff" stroke-width="3" marker-end="url(#arrow)"/><g data-box="810 330 710 390"><rect x="810" y="330" width="710" height="390" rx="20" fill="#11243b" stroke="#7eb9ff" stroke-width="2"/><text x="845" y="378" font-size="23" fill="#7eb9ff" font-weight="700" data-max-width="640">COMBINATIONS A USER CAN PICK</text><text x="845" y="470" font-size="84" fill="#f6bd70" font-weight="700" data-max-width="640">1,023</text><text x="845" y="560" font-size="23" fill="#7eb9ff" font-weight="700" data-max-width="640">INDEXES YOU MAINTAIN, ONE PER FIELD</text><text x="845" y="652" font-size="84" fill="#64e0bf" font-weight="700" data-max-width="640">10</text></g>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">2¹⁰ − 1 nonempty field subsets. Per-field indexes still use memory.</text>
