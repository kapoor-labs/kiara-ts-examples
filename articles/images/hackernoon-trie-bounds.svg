<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">DFS bounds combine two per-attribute lookups in a shared trie</title><desc id="desc">Root spans 0 to 11. Paris spans 1 to 6, containing free 2 to 3 for hotels h1 and h2, and none 4 to 5 for h3 and h5. Rome spans 7 to 10, containing free 8 to 9 for h4. The cancellation index returns both free nodes; only the one inside Paris is kept.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#64e0bf"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#64e0bf" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">08</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Paris hotels with free cancellation.</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">No index for that pair. Just two lookups.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Simplified to two levels: city, then cancellation policy.</text>
<path d="M515 390 L310 430" fill="none" stroke="#64e0bf" stroke-width="3"/><path d="M515 390 L765 430" fill="none" stroke="#304963" stroke-width="3"/><path d="M310 515 L202 590" fill="none" stroke="#64e0bf" stroke-width="3"/><path d="M310 515 L472 590" fill="none" stroke="#304963" stroke-width="3"/><path d="M765 515 L787 590" fill="none" stroke="#304963" stroke-width="3"/><g data-box="425 330 180 60"><rect x="425" y="330" width="180" height="60" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="445" y="370" font-size="25" fill="#afc2d7" font-weight="500" data-max-width="140">root [0, 11]</text></g><g data-box="160 430 300 85"><rect x="160" y="430" width="300" height="85" rx="20" fill="#11243b" stroke="#64e0bf" stroke-width="2"/><text x="190" y="483" font-size="32" fill="#64e0bf" font-weight="600" data-max-width="240">Paris [1, 6]</text></g><g data-box="615 430 300 85"><rect x="615" y="430" width="300" height="85" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="645" y="483" font-size="29" fill="#afc2d7" font-weight="500" data-max-width="240">Rome [7, 10]</text></g><g data-box="80 590 245 95"><rect x="80" y="590" width="245" height="95" rx="20" fill="#11243b" stroke="#64e0bf" stroke-width="2"/><text x="105" y="631" font-size="29" fill="#64e0bf" font-weight="600" data-max-width="195">free [2, 3]</text><text x="105" y="666" font-size="23" fill="#f2f6fc" font-weight="500" data-max-width="195">h1, h2 / keep</text></g><g data-box="350 590 245 95"><rect x="350" y="590" width="245" height="95" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="375" y="631" font-size="29" fill="#afc2d7" font-weight="500" data-max-width="195">none [4, 5]</text><text x="375" y="666" font-size="23" fill="#afc2d7" font-weight="400" data-max-width="195">h3, h5</text></g><g data-box="665 590 245 95"><rect x="665" y="590" width="245" height="95" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="690" y="631" font-size="29" fill="#afc2d7" font-weight="500" data-max-width="195">free [8, 9]</text><text x="690" y="666" font-size="23" fill="#afc2d7" font-weight="400" data-max-width="195">h4 / skip</text></g><g data-box="990 330 530 355"><rect x="990" y="330" width="530" height="355" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="1025" y="379" font-size="23" fill="#64e0bf" font-weight="700" data-max-width="460">TWO PER-ATTRIBUTE LOOKUPS</text><text x="1025" y="434" font-size="29" fill="#f2f6fc" font-weight="600" data-max-width="460">city = Paris</text><text x="1025" y="476" font-size="28" fill="#64e0bf" font-weight="600" data-max-width="460">[1, 6]</text><text x="1025" y="537" font-size="29" fill="#f2f6fc" font-weight="600" data-max-width="460">cancellation = free</text><text x="1025" y="579" font-size="28" fill="#f2f6fc" font-weight="500" data-max-width="460">[2, 3]     [8, 9]</text><text x="1025" y="644" font-size="26" fill="#64e0bf" font-weight="600" data-max-width="460">Only [2, 3] is inside [1, 6].</text></g><text x="80" y="733" font-size="27" fill="#afc2d7" font-weight="400" data-max-width="1440">Is [2, 3] inside [1, 6]? Yes. Is [8, 9]? No. A few comparisons, no ID sets.</text>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">Original schematic. Bracketed numbers come from a depth-first walk, not from the data.</text>
</g></svg>
