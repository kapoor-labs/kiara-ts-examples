<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Feature comparison chart: KiaraDB and Fuse.js</title><desc id="desc">Ticks and crosses for fourteen features. Both: exact matches across fields, typo-tolerant keyword search, and contains-any or contains-all matching on text lists. KiaraDB only: contains-any or contains-all on number lists, numeric comparisons, date and time ranges, stored ranges, missing-value filters, reported spelling corrections, a query interpreter that searches by value, and a Java edition. Fuse.js only: several typos and partial words per term, adding and removing records without a rebuild, and relevance scores with match highlighting.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#64e0bf"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#64e0bf" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">14</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Feature check:</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">KiaraDB 11, Fuse.js 6.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Typed filters, ranges, and corrections on one side; looser fuzzy text on the other.</text>
