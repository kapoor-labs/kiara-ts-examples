<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Equivalent units produce equivalent duration queries</title><desc id="desc">time less than or equal to 500 milliseconds and duration less than or equal to 0.5 seconds both compile to duration less than or equal to 0.5 canonical seconds.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#bfabff"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#bfabff" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">04</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Different units.</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">The same requirement.</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">Configured conversions produce the same canonical condition.</text>
<g data-box="80 338 560 140"><rect x="80" y="338" width="560" height="140" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="110" y="379" font-size="22" fill="#bfabff" font-weight="700" data-max-width="495">MILLISECONDS</text><text x="110" y="439" font-size="43" fill="#f2f6fc" font-weight="600" data-max-width="495">time&lt;=500ms</text></g><g data-box="80 522 560 140"><rect x="80" y="522" width="560" height="140" rx="20" fill="#11243b" stroke="#304963" stroke-width="2"/><text x="110" y="563" font-size="22" fill="#bfabff" font-weight="700" data-max-width="495">SECONDS</text><text x="110" y="623" font-size="43" fill="#f2f6fc" font-weight="600" data-max-width="495">duration&lt;=0.5s</text></g><path d="M640 408 L780 500" fill="none" stroke="#bfabff" stroke-width="3"/><path d="M640 592 L780 500" fill="none" stroke="#bfabff" stroke-width="3"/><circle cx="780" cy="500" r="10" fill="#bfabff"/><path d="M790 500 L930 500" fill="none" stroke="#bfabff" stroke-width="3" marker-end="url(#arrow)"/><g data-box="950 362 570 276"><rect x="950" y="362" width="570" height="276" rx="20" fill="#11243b" stroke="#bfabff" stroke-width="2"/><text x="985" y="412" font-size="22" fill="#bfabff" font-weight="700" data-max-width="495">ONE CANONICAL CONDITION</text><text x="985" y="493" font-size="47" fill="#f2f6fc" font-weight="600" data-max-width="495">duration &lt;= 0.5</text><text x="985" y="548" font-size="29" fill="#afc2d7" font-weight="400" data-max-width="495">stored in seconds</text><text x="985" y="600" font-size="28" fill="#bfabff" font-weight="600" data-max-width="495">same matching records</text></g>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">Declare units and aliases. Store canonical values. Ask when more than one field fits.</text>
</g></svg>
