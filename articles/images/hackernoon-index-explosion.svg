<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Combination lookups explode while per-attribute indexes grow linearly</title><desc id="desc">Left: one lookup per attribute combination needs 1,023 lookups for 10 attributes, 1,048,575 for 20, 1,073,741,823 for 30, and about 1.27 times 10 to the 30th for 100. Right: one index per attribute needs 10, 20, 30, and 100.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9Z" fill="#f6bd70"/></marker></defs>
<rect width="1600" height="840" fill="#081426"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="80" y="65" font-size="22" fill="#f6bd70" font-weight="700" data-max-width="1440">KiaraDB  /  QUERY NOTES</text>
<text x="1444" y="65" font-size="24" fill="#afc2d7" font-weight="600" data-max-width="80">09</text>
<text x="80" y="150" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">Your data has 100 attributes.</text>
<text x="80" y="224" font-size="62" fill="#f2f6fc" font-weight="700" data-max-width="1440">How many indexes do you need?</text>
<text x="80" y="278" font-size="28" fill="#afc2d7" font-weight="400" data-max-width="1440">A direct lookup for every attribute combination grows as 2ⁿ − 1.</text>
<g data-box="80 330 680 390"><rect x="80" y="330" width="680" height="390" rx="20" fill="#11243b" stroke="#f6bd70" stroke-width="2"/><text x="115" y="378" font-size="23" fill="#f6bd70" font-weight="700" data-max-width="610">ONE LOOKUP PER COMBINATION</text><text x="115" y="425" font-size="22" fill="#afc2d7" font-weight="500" data-max-width="160">attributes</text><text x="330" y="425" font-size="22" fill="#afc2d7" font-weight="500" data-max-width="380">lookups</text><text x="115" y="487" font-size="34" fill="#f2f6fc" font-weight="600" data-max-width="160">10</text><text x="330" y="487" font-size="34" fill="#f6bd70" font-weight="700" data-max-width="400">1,023</text><text x="115" y="549" font-size="34" fill="#f2f6fc" font-weight="600" data-max-width="160">20</text><text x="330" y="549" font-size="34" fill="#f6bd70" font-weight="700" data-max-width="400">1,048,575</text><text x="115" y="611" font-size="34" fill="#f2f6fc" font-weight="600" data-max-width="160">30</text><text x="330" y="611" font-size="34" fill="#f6bd70" font-weight="700" data-max-width="400">1,073,741,823</text><text x="115" y="673" font-size="34" fill="#f2f6fc" font-weight="600" data-max-width="160">100</text><text x="330" y="673" font-size="34" fill="#f6bd70" font-weight="700" data-max-width="400">≈ 1.27 × 10³⁰</text></g><path d="M760 525 L830 525" fill="none" stroke="#64e0bf" stroke-width="3" marker-end="url(#arrow)"/><g data-box="840 330 680 390"><rect x="840" y="330" width="680" height="390" rx="20" fill="#11243b" stroke="#64e0bf" stroke-width="2"/><text x="875" y="378" font-size="23" fill="#64e0bf" font-weight="700" data-max-width="610">ONE INDEX PER ATTRIBUTE</text><text x="875" y="425" font-size="22" fill="#afc2d7" font-weight="500" data-max-width="160">attributes</text><text x="1090" y="425" font-size="22" fill="#afc2d7" font-weight="500" data-max-width="380">indexes</text><text x="875" y="487" font-size="34" fill="#f2f6fc" font-weight="600" data-max-width="160">10</text><text x="1090" y="487" font-size="34" fill="#64e0bf" font-weight="700" data-max-width="380">10</text><text x="875" y="549" font-size="34" fill="#f2f6fc" font-weight="600" data-max-width="160">20</text><text x="1090" y="549" font-size="34" fill="#64e0bf" font-weight="700" data-max-width="380">20</text><text x="875" y="611" font-size="34" fill="#f2f6fc" font-weight="600" data-max-width="160">30</text><text x="1090" y="611" font-size="34" fill="#64e0bf" font-weight="700" data-max-width="380">30</text><text x="875" y="673" font-size="34" fill="#f2f6fc" font-weight="600" data-max-width="160">100</text><text x="1090" y="673" font-size="34" fill="#64e0bf" font-weight="700" data-max-width="380">100</text></g>
<path d="M80 766 L1520 766" fill="none" stroke="#304963" stroke-width="3"/>
<text x="80" y="807" font-size="22" fill="#afc2d7" font-weight="400" data-max-width="1440">Counts nonempty attribute subsets. Per-attribute indexes still use memory.</text>
</g></svg>
