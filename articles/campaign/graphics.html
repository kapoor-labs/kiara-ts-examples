<figure><img src="../images/seven-features-medium.png" alt="Three cards show required tags audited and export, a score from 80 to 95, and October 24 inside an October interval. All three feed one matching record."><figcaption>02 / Tags, dates, and ranges combined with AND &middot; <a href="../images/seven-features-medium.png">PNG</a> &middot; <a href="../images/seven-features-medium.svg">SVG</a></figcaption></figure>
