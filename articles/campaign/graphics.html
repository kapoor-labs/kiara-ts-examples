<title>KiaraDB campaign graphics</title>
<style>
body{margin:0;padding:48px;background:#081426;color:#f2f6fc;font:18px "Segoe UI",sans-serif}
h1{margin:0 0 8px;font-size:38px}p{color:#afc2d7}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
figure{margin:0}img{display:block;width:100%;height:auto;border:1px solid #304963;border-radius:12px}
figcaption{padding:12px 0}a{color:#9caaff}@media(max-width:800px){main{grid-template-columns:1fr}}
</style><h1>KiaraDB / campaign graphics</h1><p>14 original diagrams. 1600 x 840 PNG exports and editable SVG sources.</p><main>
<figure><img src="../images/seven-features-linkedin.png" alt="Status, score, tags, and window fields feed a prepared store with internal indexes. Several different queries use that same store."><figcaption>01 / Automatic indexing supports changing filter combinations &middot; <a href="../images/seven-features-linkedin.png">PNG</a> &middot; <a href="../images/seven-features-linkedin.svg">SVG</a></figcaption></figure>
<figure><img src="../images/seven-features-medium.png" alt="Three cards show required tags audited and export, a score from 80 to 95, and October 24 inside an October interval. All three feed one matching record."><figcaption>02 / Tags, dates, and ranges combined with AND &middot; <a href="../images/seven-features-medium.png">PNG</a> &middot; <a href="../images/seven-features-medium.svg">SVG</a></figcaption></figure>
<figure><img src="../images/query-interpretation-linkedin.png" alt="The query active emea is separated into status equals active and region equals emea. If active occurs in two fields, the interface asks for a choice."><figcaption>03 / Bare values resolve to field conditions &middot; <a href="../images/query-interpretation-linkedin.png">PNG</a> &middot; <a href="../images/query-interpretation-linkedin.svg">SVG</a></figcaption></figure>
<figure><img src="../images/query-interpretation-medium.png" alt="time less than or equal to 500 milliseconds and duration less than or equal to 0.5 seconds both compile to duration less than or equal to 0.5 canonical seconds."><figcaption>04 / Equivalent units produce equivalent duration queries &middot; <a href="../images/query-interpretation-medium.png">PNG</a> &middot; <a href="../images/query-interpretation-medium.svg">SVG</a></figcaption></figure>
<figure><img src="../images/typeahead.png" alt="The misspelling serch is corrected to search. Active status and score of at least 80 are still required. One record passes; an archived and a lower-score record do not."><figcaption>05 / Typo correction preserves exact filtering &middot; <a href="../images/typeahead.png">PNG</a> &middot; <a href="../images/typeahead.svg">SVG</a></figcaption></figure>
<figure><img src="../images/runtime-config.png" alt="Four candidate rules have specificity zero, one, one, and two. The exact rule wins. A separate pair of cards shows an active value of 40 and a prepared value of 50 before activation."><figcaption>06 / Explainable rule selection and snapshot replacement &middot; <a href="../images/runtime-config.png">PNG</a> &middot; <a href="../images/runtime-config.svg">SVG</a></figcaption></figure>
<figure><img src="../images/field-agnostic-java-ts.png" alt="A typed schema is prepared into internal indexes. Status, numeric bands, and collection requirements are composed in one query. Java and TypeScript are implementation options."><figcaption>07 / Schema-driven indexing and advanced filters in KiaraDB &middot; <a href="../images/field-agnostic-java-ts.png">PNG</a> &middot; <a href="../images/field-agnostic-java-ts.svg">SVG</a></figcaption></figure>
<figure><img src="../images/hackernoon-trie-bounds.png" alt="Root spans 0 to 11. Paris spans 1 to 6, containing free 2 to 3 for hotels h1 and h2, and none 4 to 5 for h3 and h5. Rome spans 7 to 10, containing free 8 to 9 for h4. The cancellation index returns both free nodes; only the one inside Paris is kept."><figcaption>08 / DFS bounds combine two per-attribute lookups in a shared trie &middot; <a href="../images/hackernoon-trie-bounds.png">PNG</a> &middot; <a href="../images/hackernoon-trie-bounds.svg">SVG</a></figcaption></figure>
<figure><img src="../images/hackernoon-index-explosion.png" alt="Left: one lookup per attribute combination needs 1,023 lookups for 10 attributes, 1,048,575 for 20, 1,073,741,823 for 30, and about 1.27 times 10 to the 30th for 100. Right: one index per attribute needs 10, 20, 30, and 100."><figcaption>09 / Combination lookups explode while per-attribute indexes grow linearly &middot; <a href="../images/hackernoon-index-explosion.png">PNG</a> &middot; <a href="../images/hackernoon-index-explosion.svg">SVG</a></figcaption></figure>
<figure><img src="../images/devto-filter-combinations.png" alt="A filter panel lists ten fields, with status, score, and tags selected. Users can pick 1,023 nonempty combinations of those fields, while the application maintains only ten per-field indexes."><figcaption>10 / Ten filter fields allow 1,023 combinations but need only ten per-field indexes &middot; <a href="../images/devto-filter-combinations.png">PNG</a> &middot; <a href="../images/devto-filter-combinations.svg">SVG</a></figcaption></figure>
<figure><img src="../images/kiaradb-vs-fusejs.png" alt="Typo search over 100,000 products took 1.95 milliseconds in KiaraDB, 422 in tuned Fuse.js, and 601 in default Fuse.js. Building the indexes for the same 100,000 products took 4,286 milliseconds in KiaraDB and 266 in Fuse.js, which also used 110 MB of memory against KiaraDB's 489 MB."><figcaption>11 / KiaraDB and Fuse.js benchmark: query latency and build time &middot; <a href="../images/kiaradb-vs-fusejs.png">PNG</a> &middot; <a href="../images/kiaradb-vs-fusejs.svg">SVG</a></figcaption></figure>
<figure><img src="../images/introducing-kiaradb.png" alt="Typo search over 100,000 products took 422 milliseconds in tuned Fuse.js and 1.95 in KiaraDB. KiaraDB answered first-20 lists 515 times faster, stemmed search 365 times, typo search 216 times, and date equality 163 times faster. It won all 26 filter queries both libraries can run and handled 66 more that Fuse.js cannot express."><figcaption>12 / Introducing KiaraDB: query speed against Fuse.js &middot; <a href="../images/introducing-kiaradb.png">PNG</a> &middot; <a href="../images/introducing-kiaradb.svg">SVG</a></figcaption></figure>
<figure><img src="../images/kiaradb-vs-fusejs-hero.png" alt="A fight-card hero image. Typo search over 100,000 products: Fuse.js took 422 milliseconds tuned and 601 with defaults; KiaraDB, crowned the winner, took 1.95 milliseconds, 216 times faster. A race strip shows KiaraDB finishing almost instantly while Fuse.js runs the full length. KiaraDB won 26 of 26 shared filter scenarios, was up to 515 times faster, and ran 66 scenarios Fuse.js cannot express."><figcaption>13 / Search showdown: KiaraDB beats Fuse.js &middot; <a href="../images/kiaradb-vs-fusejs-hero.png">PNG</a> &middot; <a href="../images/kiaradb-vs-fusejs-hero.svg">SVG</a></figcaption></figure>
<figure><img src="../images/kiaradb-vs-fusejs-features.png" alt="Ticks and crosses for fourteen features. Both: exact matches across fields, typo-tolerant keyword search, and contains-any or contains-all matching on text lists. KiaraDB only: contains-any or contains-all on number lists, numeric comparisons, date and time ranges, stored ranges, missing-value filters, reported spelling corrections, a query interpreter that searches by value, and a Java edition. Fuse.js only: several typos and partial words per term, adding and removing records without a rebuild, and relevance scores with match highlighting."><figcaption>14 / Feature comparison chart: KiaraDB and Fuse.js &middot; <a href="../images/kiaradb-vs-fusejs-features.png">PNG</a> &middot; <a href="../images/kiaradb-vs-fusejs-features.svg">SVG</a></figcaption></figure>
